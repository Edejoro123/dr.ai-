<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat AI - HealthMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green: #00ff99;
      --soft-green: rgba(0,255,153,0.15);
      --white: #ffffff;
      --text: #000000;
      --muted: rgba(0,0,0,0.72);
      --panel: rgba(255,255,255,0.38);
      --line: rgba(0,0,0,0.08);
      --shadow: rgba(0,0,0,0.08);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, rgba(0,255,153,0.08), #ffffff 22%, #ffffff 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .site-shell {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 26px 0 14px;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .brand span {
      color: var(--green);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .nav a {
      position: relative;
      z-index: 1;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 14px;
      overflow: hidden;
      transition: color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .nav a::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,255,153,0.46), rgba(255,255,255,0.4));
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 10px 22px rgba(0,0,0,0.06);
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: -1;
    }

    .nav a:hover {
      color: #000;
      transform: translateY(-1px);
    }

    .nav a:hover::before {
      opacity: 1;
      transform: scale(1);
    }

    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .outline-btn,
    .liquid-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 20px;
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text);
      background: linear-gradient(135deg, rgba(0,255,153,0.42), rgba(255,255,255,0.20));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.75), 0 8px 20px rgba(0,0,0,0.06);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .outline-btn {
      background: rgba(255,255,255,0.18);
    }

    .liquid-btn:hover,
    .outline-btn:hover {
      transform: translateY(-2px);
    }

    .hamburger {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 30px;
      height: 22px;
      cursor: pointer;
      z-index: 1001;
    }

    .hamburger span {
      display: block;
      width: 100%;
      height: 3px;
      background: var(--text);
      border-radius: 20px;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .hamburger.active span:nth-child(1) {
      transform: translateY(9px) rotate(45deg);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: translateY(-9px) rotate(-45deg);
    }

    .mobile-nav {
      display: none;
      opacity: 0;
      transform: translateY(-12px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      padding: 12px 0 24px;
    }

    .mobile-nav.active {
      display: grid;
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .mobile-nav a {
      padding: 14px 18px;
      border-radius: 14px;
      font-weight: 500;
      color: var(--text);
      border: 1px solid rgba(0,0,0,0.04);
      background: rgba(255,255,255,0.4);
      margin-bottom: 8px;
    }

    .chat-page {
      padding: 30px 0 70px;
      text-align: center;
      animation: fadeIn 1s ease forwards;
    }

    .chat-page h1 {
      font-size: clamp(2.1rem, 4vw, 3.2rem);
      color: var(--text);
      margin-bottom: 24px;
      letter-spacing: -0.06em;
    }

    .chat-page h1 span {
      color: var(--green);
    }

    .chat-container {
      max-width: 760px;
      margin: 0 auto;
      background: rgba(255,255,255,0.38);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 28px 60px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      height: 70vh;
      position: relative;
    }

    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      border-radius: 10px;
      scroll-behavior: smooth;
    }

    #messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 70%;
      animation: fadeInUp 0.6s ease;
      line-height: 1.55;
    }

    .user-message {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(0,255,153,0.88), rgba(255,255,255,0.8));
      color: #000;
      font-weight: 500;
      border: 1px solid var(--line);
    }

    .bot-message {
      align-self: flex-start;
      background: rgba(17,17,17,0.05);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 10px;
      align-self: flex-start;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #ccc;
      border-radius: 50%;
      animation: blink 1.4s infinite both;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0% { opacity: 0.2; }
      20% { opacity: 1; }
      100% { opacity: 0.2; }
    }

    #chat-form {
      display: flex;
      margin-top: 15px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
      gap: 10px;
    }

    #user-input {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.72);
      font-size: 1rem;
      color: var(--text);
      outline: none;
    }

    #chat-form button {
      background: linear-gradient(135deg, rgba(0,255,153,0.9), rgba(255,255,255,0.36));
      border: 1px solid var(--line);
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    #chat-form button:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
    }

    #scrollBtn {
      position: absolute;
      bottom: 70px;
      right: 20px;
      background: var(--green);
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.5rem;
      color: #000;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }

    #scrollBtn:hover {
      transform: scale(1.1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 920px) {
      .nav {
        display: none;
      }

      .hamburger {
        display: flex;
      }

      .nav-actions {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .chat-container {
        height: 80vh;
      }
    }
  </style>
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a href="home.html" class="brand" aria-label="Go to homepage">Dr<span>AI</span></a>

      <nav class="nav" aria-label="Main navigation">
        <a href="home.html">Home</a>
        <a href="chat.html">Chat AI</a>
        <a href="doctor-page.html">Doctors</a>
        <a href="pharmacy-page.html">Pharmacy</a>
      </nav>

      <div class="nav-actions">
        <a href="login.html" class="outline-btn">Login</a>
        <a href="signup.html" class="liquid-btn">Join now</a>
      </div>

      <div class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </header>

    <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation">
      <a href="home.html">Home</a>
      <a href="chat.html">Chat AI</a>
      <a href="doctor-page.html">Doctors</a>
      <a href="pharmacy-page.html">Pharmacy</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Sign up</a>
    </nav>

    <main class="chat-page">
      <h1>Chat with <span>Dr AI</span></h1>
      <div class="chat-container">
        <div id="chat-window">
          <div id="messages"></div>
        </div>
        <button id="scrollBtn" aria-label="Scroll to latest message">⬇</button>
        <form id="chat-form">
          <input type="text" id="user-input" placeholder="Type your symptoms here..." required>
          <button type="submit">Send</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileNav = document.getElementById('mobileNav');

    hamburger.addEventListener('click', () => {
      const isOpen = hamburger.classList.toggle('active');
      mobileNav.classList.toggle('active', isOpen);
    });

    const chatForm = document.getElementById('chat-form');
    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('user-input');
    const chatWindow = document.getElementById('chat-window');
    const scrollBtn = document.getElementById('scrollBtn');

    // Show/hide scroll-to-bottom button
    chatWindow.addEventListener('scroll', () => {
      if (chatWindow.scrollTop + chatWindow.clientHeight < chatWindow.scrollHeight - 20) {
        scrollBtn.style.display = 'flex';
      } else {
        scrollBtn.style.display = 'none';
      }
    });

    // Scroll to bottom when button clicked
    scrollBtn.addEventListener('click', () => {
      chatWindow.scrollTop = chatWindow.scrollHeight;
    });



    // Function to display messages
    function displayMessage(message, sender) {
      const messageDiv = document.createElement('div');
      messageDiv.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
      messageDiv.textContent = message;
      messagesDiv.appendChild(messageDiv);
      chatWindow.scrollTop = chatWindow.scrollHeight; // Auto-scroll
    }

    // Function to show typing animation
    function showTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.classList.add('typing-indicator');
      typingDiv.innerHTML = `<span></span><span></span><span></span>`;
      messagesDiv.appendChild(typingDiv);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return typingDiv;
    }

    const localBotReplies = {
      headache: "Headaches can be caused by stress, dehydration, or lack of sleep. Rest, drink water, and take a break from screens.",
      fever: "A fever often means your body is fighting an infection. Stay hydrated, rest, and seek care if it stays high.",
      cold: "A cold usually improves with rest, fluids, and over-the-counter symptom relief. Watch your symptoms for any changes.",
      hello: "Hello! How can I assist you today with your health concerns?",
      thanks: "You're welcome! Stay healthy and rest well.",
      goodbye: "Goodbye! Take care and let me know if you need anything else.",
      default: "I'm here to help. Please describe your symptoms in more detail so I can give better guidance.",
    };

    function getLocalBotReply(userMessage) {
      const text = userMessage.toLowerCase();
      if (/(hi|hello|hey)/.test(text)) return localBotReplies.hello;
      if (/(thanks|thank you)/.test(text)) return localBotReplies.thanks;
      if (/(bye|goodbye|see you)/.test(text)) return localBotReplies.goodbye;
      if (text.includes('headache')) return localBotReplies.headache;
      if (text.includes('fever')) return localBotReplies.fever;
      if (text.includes('cold') || text.includes('flu')) return localBotReplies.cold;
      return localBotReplies.default;
    }

    // Function to process user input with ChatGPT (server-side /api/chat with local fallback)
    async function processInputWithAI(userMessage) {
      if (window.location.protocol === 'file:') {
        return getLocalBotReply(userMessage);
      }

      const apiUrl = '/api/chat';

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ message: userMessage }),
        });

        if (!response.ok) {
          return getLocalBotReply(userMessage);
        }

        const data = await response.json();
        return data.reply;
      } catch (error) {
        return getLocalBotReply(userMessage);
      }
    }

    // Handle form submission
    chatForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const userMessage = userInput.value.trim();

      if (userMessage) {
        displayMessage(userMessage, 'user'); // Show user message
        userInput.value = '';

        const typingIndicator = showTypingIndicator();

        try {
          const botReply = await processInputWithAI(userMessage);
          typingIndicator.remove();
          displayMessage(botReply, 'bot');
        } catch (error) {
          typingIndicator.remove();
          displayMessage("I'm sorry, I'm having trouble connecting right now. Please try again later.", 'bot');
        }
      }
    });
  </script>
</body>
</html>
