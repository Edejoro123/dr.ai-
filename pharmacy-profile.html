<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dr AI | Pharmacy Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --green: #00ff99; --text: #000; --muted: rgba(0,0,0,0.72); }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Poppins', sans-serif; background: #fff; color: var(--text); }
      .wrap { min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, rgba(0,255,153,0.09), rgba(255,255,255,0.9)); padding: 28px; }
      .card { width: min(760px, 100%); padding: 30px 28px; border-radius: 28px; background: rgba(255,255,255,0.22); border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 24px 50px rgba(0,0,0,0.08); backdrop-filter: blur(15px); }
      h1 { margin-top: 10px; font-size: clamp(2rem,3vw,2.7rem); }
      .sub { margin-top: 8px; color: var(--muted); }
      form { margin-top: 22px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .field { display: grid; gap: 8px; }
      .field.full { grid-column: 1 / -1; }
      label { font-size: 0.82rem; font-weight: 600; }
      input, textarea { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.72); font-family: 'Poppins', sans-serif; font-size: 0.96rem; }
      textarea { resize: vertical; min-height: 120px; }
      input:focus, textarea:focus { outline: none; border-color: rgba(0,255,153,0.8); box-shadow: 0 0 0 4px rgba(0,255,153,0.18); }
      button { grid-column: 1 / -1; border: none; border-radius: 18px; font-family: 'Poppins', sans-serif; font-weight: 600; padding: 14px 18px; cursor: pointer; background: linear-gradient(135deg, rgba(0,255,153,0.9), rgba(0,255,153,0.42)); color: #000; transition: transform 0.2s ease, background 0.2s ease; }
      button:hover { transform: translateY(-2px); background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.75)); }
      .message { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 12px; font-size: 0.9rem; }
      .message.success { display: block; background: rgba(0,255,153,0.18); border: 1px solid rgba(0,255,153,0.4); }
      .message.error { display: block; background: rgba(255, 88, 88, 0.12); border: 1px solid rgba(255, 88, 88, 0.35); }
      @media (max-width: 640px) { form { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Pharmacy profile</h1>
        <p class="sub">Complete the details for your pharmacy storefront and licensing.</p>

        <form id="pharmacyForm">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" placeholder="Enter your unique username" required />
          </div>
          <div class="field">
            <label for="experience">Years of experience</label>
            <input id="experience" type="number" min="1" placeholder="1+" required />
          </div>
          <div class="field full">
            <label for="bio">Biography</label>
            <textarea id="bio" placeholder="Describe your pharmacy and services" required></textarea>
          </div>
          <div class="field">
            <label for="location">Store location</label>
            <input id="location" type="text" placeholder="Pharmacy shop location" required />
          </div>
          <div class="field">
            <label for="phone">Phone / WhatsApp</label>
            <input id="phone" type="text" placeholder="Contact number" required />
          </div>
          <div class="field full">
            <label for="licence">Upload licence</label>
            <input id="licence" type="file" />
          </div>
          <div class="field full">
            <label for="profilePic">Profile picture</label>
            <input id="profilePic" type="file" accept="image/*" />
          </div>
          <button type="submit">Complete pharmacy profile</button>
        </form>

        <div id="message" class="message"></div>
      </div>
    </div>

    <script>
      const pharmacyForm = document.getElementById('pharmacyForm');
      const messageBox = document.getElementById('message');
      function showMessage(text, type) {
        messageBox.textContent = text;
        messageBox.className = `message ${type}`;
      }

      pharmacyForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = {
          username: document.getElementById('username').value.trim(),
          yearsExperience: document.getElementById('experience').value,
          biography: document.getElementById('bio').value.trim(),
          location: document.getElementById('location').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          licence: document.getElementById('licence').value,
          profilePic: document.getElementById('profilePic').value,
        };

        const response = await fetch('/api/profile/pharmacy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await response.json();
        if (response.ok) {
          showMessage('Pharmacy profile saved successfully.', 'success');
        } else {
          showMessage(data.message || 'Unable to save pharmacy profile.', 'error');
        }
      });
    </script>
  </body>
</html>
